schema: spec-driven

context: |
  Project: Inventory Dashboard, a local-first catalog of current and historical
    development projects and repositories.
  Frontend: Next.js App Router and TypeScript.
  Backend: Go HTTP API and application services.
  Persistence: SQLite for the initial local single-user runtime.
  Workflow: Trello tracks status and evidence; OpenSpec tracks requirements,
    behavior, design, and implementation traceability.
  Security: never include credentials, private URLs, source contents, or
    sensitive project metadata in tracked artifacts or agent output.
  Context: Graphify and Codebase Memory are mandatory read-only navigation
    sources for implementation work and must target the active worktree.

rules:
  proposal:
    - Reference affected Trello task IDs when cards exist.
    - State whether the change affects product behavior, API, persistence,
      workflow, tooling, or documentation.
    - State non-goals explicitly.
  specs:
    - Use RFC 2119 keywords and verifiable Given/When/Then scenarios.
    - Keep implementation details in design.md unless externally observable.
    - Do not include secrets, private URLs, source contents, or private project
      metadata.
  design:
    - Document local runtime boundaries, API/data ownership, error behavior,
      security, observability, and migration implications when relevant.
    - Explain why SQLite remains appropriate or what decision requires MySQL.
  tasks:
    - Map implementation tasks to Trello IDs when work spans the backlog.
    - Include validation commands, test obligations, worktree expectations,
      and Graphify/Codebase Memory evidence expectations.
