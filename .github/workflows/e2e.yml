name: E2E tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test --reporter=json > test-results.json

      - name: Write test summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const result = JSON.parse(fs.readFileSync('test-results.json', 'utf8'))
          const rows = []

          function collect(suite, parents = []) {
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                const result = test.results?.at(-1)
                rows.push({
                  file: [...parents, suite.title, spec.title].filter(Boolean).join(' / '),
                  status: test.status ?? result?.status ?? 'unknown',
                  duration: result?.duration ?? 0,
                })
              }
            }
            for (const child of suite.suites ?? []) collect(child, [...parents, suite.title])
          }

          for (const suite of result.suites ?? []) collect(suite)

          const failed = rows.filter(({ status }) => status !== 'expected').length
          const total = rows.length
          const passed = rows.filter(({ status }) => status === 'expected').length
          const duration = rows.reduce((sum, row) => sum + row.duration, 0)

          const lines = [
            '## Playwright E2E results',
            '',
            `**${failed === 0 ? 'Passed' : 'Failed'}**: ${passed}/${total} tests passed`,
            `**Duration**: ${duration} ms`,
            '',
            '| Test | Status | Duration |',
            '| --- | --- | ---: |',
            ...rows.map(({ file, status, duration }) =>
              `| \`${file}\` | ${status === 'expected' ? 'PASS' : status.toUpperCase()} | ${duration} ms |`),
          ]

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          NODE

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results.json
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Fail if E2E tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
